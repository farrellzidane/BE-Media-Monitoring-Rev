services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: media_monitoring
      POSTGRES_USER: media_monitor
      POSTGRES_PASSWORD: media_monitor
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_monitor -d media_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
